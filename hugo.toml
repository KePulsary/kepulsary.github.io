baseURL = "https://kepulsary.github.io/"
defaultContentLanguage = "zh-cn"
title = "KePulsaryのblog"
theme = "hugo-theme-stack"
hasCJKLanguage = true
enableEmoji = true

[pagination]
pagerSize = 10

[permalinks]
posts = "/:year/:month/:day/:filename/"

[frontmatter]
lastmod = ["lastmod", "updated", ":git", "date"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    tabWidth = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 5
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 10
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 15
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 20

  [[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/KePulsary"
    weight = 1

[params]
mainSections = ["posts"]
favicon = "/favicon.ico"
description = "AI & Security · CTF · 折腾笔记"

  [params.footer]
    since = 2021
    customText = ""

  [params.dateFormat]
    published = ":date_full"
    lastUpdated = ":date_full"

  [params.sidebar]
    emoji = "🛡️"
    subtitle = "AI & SEC"
    avatar = "img/avatar.jpg"

  [params.article]
    math = false
    readingTime = true
    [params.article.license]
      enabled = false

  [params.widgets]
    [[params.widgets.homepage]]
      type = "search"
    [[params.widgets.homepage]]
      type = "archives"
      limit = 5
    [[params.widgets.homepage]]
      type = "categories"
      limit = 10
    [[params.widgets.homepage]]
      type = "tag-cloud"
      limit = 10
    [[params.widgets.page]]
      type = "toc"

  [params.colorScheme]
    toggle = true
    default = "auto"

  [params.comments]
    enabled = false

  [params.opengraph.twitter]
    card = "summary_large_image"

  [params.defaultImage]
    [params.defaultImage.opengraph]
      enabled = false
      local = false
      src = ""
